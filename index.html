<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eiverth | Med & Gym Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Configuración personalizada -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Rajdhani', 'sans-serif'],
                    },
                    colors: {
                        neon: {
                            cyan: '#00f3ff',
                            purple: '#bc13fe',
                            green: '#39ff14',
                            red: '#ff003c',
                            dark: '#050b14'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050b14;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(188, 19, 254, 0.05) 0%, transparent 40%);
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* Efectos Neon */
        .glow-cyan { box-shadow: 0 0 10px rgba(0, 243, 255, 0.3), inset 0 0 5px rgba(0, 243, 255, 0.1); }
        .glow-cyan-text { text-shadow: 0 0 8px rgba(0, 243, 255, 0.6); }
        .glow-purple { box-shadow: 0 0 15px rgba(188, 19, 254, 0.3), inset 0 0 10px rgba(188, 19, 254, 0.1); }
        .glow-green { box-shadow: 0 0 15px rgba(57, 255, 20, 0.4), inset 0 0 10px rgba(57, 255, 20, 0.2); }
        
        /* Glassmorphism */
        .glass-panel {
            background: rgba(10, 15, 30, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Inputs nativos oscuros */
        select, input[type="text"], input[type="time"] {
            color-scheme: dark;
        }

        /* Animaciones para el feedback */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse-border {
            0% { border-color: rgba(0, 243, 255, 0.3); }
            50% { border-color: rgba(0, 243, 255, 1); box-shadow: 0 0 15px rgba(0,243,255,0.4); }
            100% { border-color: rgba(0, 243, 255, 0.3); }
        }
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8 font-sans selection:bg-neon-cyan selection:text-black">

    <main class="glass-panel w-full max-w-3xl rounded-3xl p-6 sm:p-10 relative z-10 border-t border-neon-cyan/30 shadow-[0_10px_40px_rgba(0,0,0,0.8)]">
        
        <!-- Encabezado -->
        <header class="text-center mb-10">
            <h1 class="text-3xl sm:text-4xl font-display font-bold text-white mb-2">
                Reporte biométrico y de entrenamiento diario
            </h1>
            <h2 class="text-2xl sm:text-3xl font-display text-neon-cyan glow-cyan-text font-semibold mt-4">
                ¡Hola Eiverth, ¿cómo estás?!
            </h2>
        </header>

        <!-- Formulario -->
        <form id="trackerForm" class="space-y-8" onsubmit="handleFormSubmit(event)">
            
            <!-- Pregunta 1: Entrenamiento -->
            <section class="space-y-2">
                <label for="workout" class="block text-lg font-semibold text-white">
                    <span class="mr-2">⚡</span> ¿Qué vas a entrenar hoy, pierna o tren superior?
                </label>
                <select id="workout" required onchange="handleWorkoutChange()"
                    class="w-full bg-slate-900/80 border border-slate-600 rounded-xl p-4 text-white focus:outline-none focus:border-neon-cyan focus:glow-cyan transition-all appearance-none cursor-pointer">
                    <option value="" disabled selected>Selecciona tu rutina...</option>
                    <option value="Pierna">Pierna</option>
                    <option value="Tren Superior">Tren Superior</option>
                </select>
                <!-- Feedback Dinámico Q1 -->
                <div id="workout-feedback" class="hidden text-neon-cyan font-bold italic pt-2 pl-2 fade-in"></div>
            </section>

            <!-- Pregunta 2: Creatina -->
            <section class="space-y-2">
                <label for="creatina" class="block text-lg font-semibold text-white">
                    <span class="mr-2 text-neon-green">🔋</span> ¿Cómo te has sentido con la creatina?
                </label>
                <input type="text" id="creatina" placeholder="Escribe tu respuesta aquí..." required
                    class="w-full bg-slate-900/80 border border-slate-600 rounded-xl p-4 text-white focus:outline-none focus:border-neon-green focus:shadow-[0_0_15px_rgba(57,255,20,0.2)] transition-all">
            </section>

            <!-- Pregunta 3: Descanso -->
            <section class="space-y-2">
                <label for="rest" class="block text-lg font-semibold text-white">
                    <span class="mr-2">🛌</span> ¿Descansaste?
                </label>
                <select id="rest" required onchange="handleRestChange()"
                    class="w-full bg-slate-900/80 border border-slate-600 rounded-xl p-4 text-white focus:outline-none focus:border-neon-purple focus:glow-purple transition-all appearance-none cursor-pointer">
                    <option value="" disabled selected>Selecciona una opción...</option>
                    <option value="Sí">Sí</option>
                    <option value="No">No</option>
                </select>
                <!-- Feedback Dinámico Q3 -->
                <div id="rest-feedback" class="hidden font-bold italic pt-2 pl-2 fade-in"></div>
            </section>

            <!-- Pregunta 4: Medicina (Interactiva) -->
            <section class="space-y-4 p-6 rounded-2xl border border-neon-purple/40 bg-neon-purple/5 relative">
                <label class="block text-xl font-display font-bold text-neon-purple glow-purple-text mb-2">
                    ⚕️ Pregunta Médica
                </label>
                <p class="text-white text-lg">
                    En el síndrome de Guillain-Barré, ¿cuál es el hallazgo característico en el LCR?
                </p>
                
                <!-- Opciones -->
                <div class="space-y-3 mt-4" id="med-options">
                    <button type="button" onclick="checkAnswer('A', this)" class="med-btn w-full text-left p-4 rounded-xl border border-slate-600 bg-slate-900/50 text-slate-200 hover:bg-slate-800 hover:border-slate-400 transition-all">
                        A) Pleocitosis
                    </button>
                    <button type="button" onclick="checkAnswer('B', this)" class="med-btn w-full text-left p-4 rounded-xl border border-slate-600 bg-slate-900/50 text-slate-200 hover:bg-slate-800 hover:border-slate-400 transition-all">
                        B) Disociación albúmino-citológica
                    </button>
                    <button type="button" onclick="checkAnswer('C', this)" class="med-btn w-full text-left p-4 rounded-xl border border-slate-600 bg-slate-900/50 text-slate-200 hover:bg-slate-800 hover:border-slate-400 transition-all">
                        C) Hipoglucorraquia
                    </button>
                </div>
                
                <!-- Feedback Médico -->
                <div id="med-feedback" class="hidden mt-4 p-4 rounded-xl border fade-in text-sm md:text-base"></div>
                <!-- Input oculto para validación de formulario -->
                <input type="hidden" id="med-answered" required>
            </section>

            <!-- Pregunta 5: Hora -->
            <section class="space-y-3">
                <label for="workout-time" class="block text-xl font-display font-bold text-white text-center mt-8">
                    ¿A qué hora entrenamos mañana?
                </label>
                <div class="flex justify-center">
                    <input type="time" id="workout-time" required
                        class="bg-slate-900/90 border-2 border-neon-cyan rounded-xl px-8 py-4 text-2xl font-display font-bold text-neon-cyan focus:outline-none focus:bg-black transition-all"
                        style="animation: pulse-border 2s infinite;">
                </div>
            </section>

            <!-- Botón Submit -->
            <div class="pt-8">
                <button type="submit" 
                    class="w-full relative group overflow-hidden rounded-xl bg-neon-cyan/10 border-2 border-neon-cyan px-8 py-4 font-display font-bold text-2xl tracking-widest text-white transition-all hover:bg-neon-cyan hover:text-black hover:glow-cyan shadow-[0_0_20px_rgba(0,243,255,0.2)]">
                    <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/40 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite] skew-x-12"></div>
                    CONFIRMAR
                </button>
            </div>
        </form>
    </main>

    <!-- Modal Futurista -->
    <div id="success-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/90 backdrop-blur-xl opacity-0 transition-opacity duration-500">
        <div class="glass-panel border border-neon-cyan glow-cyan rounded-3xl p-8 sm:p-12 max-w-2xl w-full mx-4 text-center transform scale-95 transition-transform duration-500" id="modal-content">
            
            <!-- Hora Gigante -->
            <div class="mb-8">
                <span id="display-time" class="text-7xl sm:text-9xl font-display font-bold text-neon-cyan glow-cyan-text tracking-tighter">
                    --:--
                </span>
            </div>

            <!-- Texto Exacto Solicitado -->
            <div class="mb-10 px-4">
                <p class="text-2xl sm:text-3xl font-display text-white leading-relaxed">
                    excelente a esa hora nos vemos. pásame un capture de la hora que escogiste
                </p>
            </div>

            <button type="button" onclick="closeModal()" 
                class="w-full sm:w-auto px-10 py-3 bg-slate-900 hover:bg-slate-800 text-slate-300 font-semibold rounded-full transition-colors border border-slate-700 hover:border-slate-500 hover:text-white">
                Cerrar y tomar capture
            </button>
        </div>
    </div>

    <!-- Script de lógica -->
    <script>
        // 1. Lógica dinámica del entrenamiento
        function handleWorkoutChange() {
            const select = document.getElementById('workout');
            const feedback = document.getElementById('workout-feedback');
            
            feedback.classList.remove('hidden');
            
            if (select.value === 'Pierna') {
                feedback.innerHTML = '🦵 ¡A destruir esas piernas!';
            } else if (select.value === 'Tren Superior') {
                feedback.innerHTML = '🦍 ¡A mutar esos brazos y pecho!';
            }
        }

        // 2. Lógica dinámica del descanso
        function handleRestChange() {
            const select = document.getElementById('rest');
            const feedback = document.getElementById('rest-feedback');
            
            feedback.classList.remove('hidden');
            
            if (select.value === 'Sí') {
                feedback.className = 'font-bold italic pt-2 pl-2 fade-in text-neon-green';
                feedback.innerHTML = '🔋 ¡Excelente, a romperla con toda la energía!';
            } else if (select.value === 'No') {
                feedback.className = 'font-bold italic pt-2 pl-2 fade-in text-yellow-400';
                feedback.innerHTML = '⚠️ ¡Qué chimbo que no descansaste, ya más tarde te recuperas!';
            }
        }

        // 3. Lógica Pregunta Médica
        function checkAnswer(selected, buttonElement) {
            const allButtons = document.querySelectorAll('.med-btn');
            const feedbackBox = document.getElementById('med-feedback');
            const hiddenInput = document.getElementById('med-answered');
            
            // Deshabilitar todos los botones para evitar múltiples respuestas
            allButtons.forEach(btn => {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.classList.remove('hover:bg-slate-800', 'hover:border-slate-400');
            });

            // Resaltar el botón clickeado quitándole la opacidad
            buttonElement.classList.remove('opacity-50');
            
            // Validar respuesta
            feedbackBox.classList.remove('hidden');
            
            if (selected === 'B') {
                // Correcto
                buttonElement.classList.remove('bg-slate-900/50', 'border-slate-600');
                buttonElement.classList.add('bg-neon-green/20', 'border-neon-green', 'text-neon-green', 'shadow-[0_0_10px_rgba(57,255,20,0.3)]');
                
                feedbackBox.classList.add('bg-neon-green/10', 'border-neon-green/50', 'text-green-300');
                feedbackBox.innerHTML = '<strong>¡CORRECTO! ✅</strong><br>La disociación albúmino-citológica (aumento de proteínas en el LCR sin aumento significativo de células) es el hallazgo clásico, reflejando inflamación de las raíces nerviosas sin una infección activa en el espacio subaracnoideo.';
            } else {
                // Incorrecto (A o C)
                buttonElement.classList.remove('bg-slate-900/50', 'border-slate-600');
                buttonElement.classList.add('bg-red-500/20', 'border-red-500', 'text-red-400', 'shadow-[0_0_10px_rgba(255,0,0,0.3)]');
                
                // Mostrar cuál era la correcta
                allButtons[1].classList.remove('opacity-50');
                allButtons[1].classList.add('border-neon-green/50', 'text-neon-green');

                feedbackBox.classList.add('bg-red-500/10', 'border-red-500/50', 'text-red-200');
                
                if (selected === 'A') {
                    feedbackBox.innerHTML = '<strong>¡INCORRECTO! ❌</strong><br>La pleocitosis (aumento de células) sugiere etiologías infecciosas (como meningitis). En Guillain-Barré el recuento celular suele ser normal.<br><br><em>Respuesta correcta: B) Disociación albúmino-citológica.</em>';
                } else if (selected === 'C') {
                    feedbackBox.innerHTML = '<strong>¡INCORRECTO! ❌</strong><br>La hipoglucorraquia (glucosa baja) se ve típicamente en meningitis bacteriana o fúngica, no en Guillain-Barré (donde la glucosa es normal).<br><br><em>Respuesta correcta: B) Disociación albúmino-citológica.</em>';
                }
            }

            // Marcar como respondida para permitir el submit
            hiddenInput.value = "answered";
        }

        // 4. Lógica de Envío y Modal
        function handleFormSubmit(event) {
            event.preventDefault();

            const hiddenMedInput = document.getElementById('med-answered').value;
            if (!hiddenMedInput) {
                alert("¡Doctor Eiverth, debe responder la pregunta médica antes de continuar!");
                return;
            }

            const timeInput = document.getElementById('workout-time').value;
            
            // Formatear hora a AM/PM
            const [hours, minutes] = timeInput.split(':');
            const date = new Date();
            date.setHours(parseInt(hours, 10));
            date.setMinutes(parseInt(minutes, 10));
            
            const formattedTime = date.toLocaleTimeString('es-ES', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: true 
            }).toUpperCase();

            // Mostrar en el modal
            document.getElementById('display-time').textContent = formattedTime;
            
            const modal = document.getElementById('success-modal');
            const modalContent = document.getElementById('modal-content');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // Trigger animaciones
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.classList.add('opacity-100');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('success-modal');
            const modalContent = document.getElementById('modal-content');
            
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 500);
        }
    </script>
</body>
</html>
