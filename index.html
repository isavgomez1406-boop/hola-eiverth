<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitEiverth Pro - Gym Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000; /* Fondo negro profundo para desktop */
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        /* Ocultar scrollbar pero permitir scroll */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        .app-container {
            /* Simular aspecto de móvil en desktop */
            max-width: 480px;
            margin: 0 auto;
            background-color: #0f172a; /* bg-slate-900 */
            height: 100vh;
            height: 100dvh; /* Para navegadores móviles modernos */
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .view-section {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 5rem; /* Espacio para el nav bottom */
        }
        .view-section.active {
            display: flex;
            flex-direction: column;
        }
        .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Animaciones para los Toasts */
        @keyframes slideInUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast-enter { animation: slideInUp 0.3s ease-out forwards; }
        .toast-exit { animation: fadeOut 0.3s ease-out forwards; }

        /* Estilos de checkbox personalizado */
        .custom-checkbox {
            appearance: none;
            width: 28px;
            height: 28px;
            border: 2px solid #3b82f6; /* blue-500 */
            border-radius: 50%;
            display: inline-block;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .custom-checkbox:checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        .custom-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 8px;
            top: 4px;
            width: 8px;
            height: 14px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .line-through-transition {
            transition: text-decoration 0.2s ease, opacity 0.2s ease;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- HEADER GENERAL -->
        <header class="pt-12 pb-4 px-6 bg-slate-900 border-b border-slate-800 z-10" id="main-header">
            <h1 class="text-2xl font-bold text-white tracking-tight flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-blue-500" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z"/>
                </svg>
                FitTrack Pro
            </h1>
        </header>

        <!-- HEADER ENTRENAMIENTO ACTIVO (Oculto por defecto) -->
        <header class="pt-12 pb-4 px-4 bg-slate-900 border-b border-slate-800 z-10 hidden" id="workout-header">
            <div class="flex items-center justify-between">
                <button onclick="finishWorkout()" class="p-2 bg-slate-800 rounded-full text-slate-300 hover:text-white transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                </button>
                <h1 class="text-lg font-bold text-white truncate px-4" id="workout-title">Entrenando...</h1>
                <button onclick="finishWorkout()" class="text-sm font-semibold text-blue-500 uppercase tracking-wide">Fin</button>
            </div>
            <div class="mt-4 w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                <div id="workout-progress" class="bg-blue-500 h-full transition-all duration-300" style="width: 0%;"></div>
            </div>
        </header>

        <!-- VIEW: HOME (Lista de Rutinas) -->
        <main id="view-home" class="view-section active p-4">
            <div class="flex justify-between items-end mb-6">
                <h2 class="text-xl font-semibold text-slate-100">Mis Rutinas</h2>
            </div>
            
            <!-- Contenedor Lista -->
            <div id="routines-list" class="flex flex-col gap-4">
                <!-- Skeleton Loader -->
                <div class="animate-pulse bg-slate-800 rounded-2xl h-24 w-full"></div>
                <div class="animate-pulse bg-slate-800 rounded-2xl h-24 w-full"></div>
            </div>
            
            <!-- Estado vacío (Oculto por defecto) -->
            <div id="empty-state" class="hidden flex-col items-center justify-center text-center mt-12 px-6">
                <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center mb-4 text-blue-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                </div>
                <h3 class="text-lg font-medium text-slate-200 mb-2">Sin rutinas aún</h3>
                <p class="text-sm text-slate-400 mb-6">Agrega tu primera rutina de entrenamiento para empezar a darle duro.</p>
                <button onclick="switchView('view-add')" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-medium transition shadow-lg shadow-blue-500/30">
                    Crear Nueva Rutina
                </button>
            </div>
        </main>

        <!-- VIEW: AÑADIR RUTINA -->
        <main id="view-add" class="view-section bg-slate-900">
            <div class="p-4 border-b border-slate-800 bg-slate-900 sticky top-0 z-10 flex justify-between items-center">
                <h2 id="add-view-title" class="text-xl font-semibold text-white">Nueva Rutina</h2>
                <button onclick="saveRoutine()" class="text-blue-500 font-semibold text-sm bg-blue-500/10 px-4 py-2 rounded-lg">Guardar</button>
            </div>
            
            <div class="p-4 space-y-6">
                <!-- Nombre de la Rutina -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-2 uppercase tracking-wider">Nombre de la Rutina</label>
                    <input type="text" id="new-routine-name" placeholder="Ej. Día de Pierna..." class="w-full bg-slate-800 text-white rounded-xl p-4 border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition placeholder-slate-500 font-medium">
                </div>

                <div class="border-t border-slate-800 pt-6">
                    <div class="flex justify-between items-center mb-4">
                        <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Ejercicios</label>
                    </div>
                    
                    <!-- Contenedor de Formulario de Ejercicios -->
                    <div id="exercises-container" class="space-y-4">
                        <!-- Los ejercicios se inyectan aquí -->
                    </div>

                    <button onclick="addExerciseBlock()" class="mt-6 w-full py-4 border-2 border-dashed border-slate-700 text-slate-400 rounded-xl font-medium hover:border-slate-500 hover:text-slate-300 transition flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                        Añadir Ejercicio
                    </button>
                </div>
            </div>
        </main>

        <!-- VIEW: DETALLE DE RUTINA -->
        <main id="view-detail" class="view-section">
            <div class="p-4">
                <button onclick="switchView('view-home')" class="text-slate-400 mb-4 flex items-center gap-1 text-sm font-medium hover:text-white transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                    Volver
                </button>
                
                <div class="flex justify-between items-start mb-6">
                    <h2 id="detail-routine-name" class="text-3xl font-bold text-white tracking-tight">Cargando...</h2>
                    <button onclick="deleteCurrentRoutine()" class="p-2 text-red-400 hover:bg-red-400/10 rounded-lg transition" title="Eliminar rutina">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </button>
                </div>

                <div id="detail-exercises-list" class="space-y-3 mb-8">
                    <!-- Ejercicios en detalle -->
                </div>

                <button id="start-workout-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl shadow-[0_4px_20px_-4px_rgba(59,130,246,0.5)] transition text-lg flex justify-center items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" /></svg>
                    Iniciar Entrenamiento
                </button>
            </div>
        </main>

        <!-- VIEW: ENTRENAMIENTO ACTIVO -->
        <main id="view-active-workout" class="view-section bg-slate-950 pb-8">
            <!-- Los ejercicios activos se mostrarán aquí con estilo tarjeta completa -->
            <div id="active-exercises-container" class="p-4 space-y-4">
                <!-- Inyectado via JS -->
            </div>
            
            <div class="px-4 mt-8 pb-10">
                <button onclick="finishWorkout(true)" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-2xl shadow-[0_4px_20px_-4px_rgba(16,185,129,0.5)] transition text-lg flex justify-center items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                    Completar Entrenamiento
                </button>
            </div>
        </main>

        <!-- BOTTOM NAV BAR -->
        <nav id="bottom-nav" class="absolute bottom-0 w-full glass-nav px-6 py-3 flex justify-around items-center z-20 pb-safe">
            <button onclick="switchView('view-home')" class="nav-btn flex flex-col items-center gap-1 text-slate-500 hover:text-blue-500 transition active-nav">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                <span class="text-[10px] font-medium">Inicio</span>
            </button>
            
            <button onclick="switchView('view-add')" class="nav-btn group relative -top-6">
                <div class="bg-blue-600 group-hover:bg-blue-500 h-14 w-14 rounded-full flex items-center justify-center shadow-[0_8px_16px_rgba(37,99,235,0.4)] transition transform group-hover:scale-105 border-4 border-slate-900">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                </div>
            </button>
            
            <!-- Perfil mockeado visualmente -->
            <button class="nav-btn flex flex-col items-center gap-1 text-slate-500 hover:text-blue-500 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                <span class="text-[10px] font-medium">Perfil</span>
            </button>
        </nav>

        <!-- Contenedor para Notificaciones (Toasts) -->
        <div id="toast-container" class="absolute top-4 left-0 right-0 px-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    </div>

    <!-- Aplicación y Almacenamiento Local (LocalStorage) -->
    <script>
        // Global State
        let routinesData = [];
        let selectedRoutineId = null;
        let editingRoutineId = null; // ID de la rutina que se está editando
        
        // Entrenamiento activo
        let activeWorkoutSession = [];

        // DOM Elements
        const views = {
            home: document.getElementById('view-home'),
            add: document.getElementById('view-add'),
            detail: document.getElementById('view-detail'),
            active: document.getElementById('view-active-workout')
        };
        const bottomNav = document.getElementById('bottom-nav');
        const mainHeader = document.getElementById('main-header');
        const workoutHeader = document.getElementById('workout-header');
        const routinesListContainer = document.getElementById('routines-list');
        const emptyStateContainer = document.getElementById('empty-state');
        const exercisesContainer = document.getElementById('exercises-container');
        const newRoutineNameInput = document.getElementById('new-routine-name');
        const addViewTitle = document.getElementById('add-view-title');

        // Custom Toast System
        window.showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgColor = type === 'error' ? 'bg-red-500' : (type === 'warning' ? 'bg-orange-500' : 'bg-emerald-500');
            
            toast.className = `${bgColor} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 text-sm font-medium toast-enter max-w-sm mx-auto w-full`;
            
            let iconHtml = '';
            if(type === 'success') {
                iconHtml = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>`;
            } else if (type === 'error') {
                iconHtml = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>`;
            }

            toast.innerHTML = `${iconHtml} <span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // Modal de Confirmación Reutilizable
        window.confirmAction = (title, message, onConfirm, confirmBtnColor = 'bg-red-600 hover:bg-red-500') => {
            const modalHtml = `
                <div id="custom-modal" class="absolute inset-0 z-50 flex items-center justify-center bg-black/80 px-4">
                    <div class="bg-slate-800 rounded-2xl p-6 w-full max-w-sm border border-slate-700 shadow-2xl">
                        <h3 class="text-xl font-bold text-white mb-2">${title}</h3>
                        <p class="text-slate-400 text-sm mb-6">${message}</p>
                        <div class="flex gap-3">
                            <button id="modal-cancel" class="flex-1 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl text-white font-medium transition">Cancelar</button>
                            <button id="modal-confirm" class="flex-1 py-3 ${confirmBtnColor} rounded-xl text-white font-medium transition">Confirmar</button>
                        </div>
                    </div>
                </div>
            `;
            document.querySelector('.app-container').insertAdjacentHTML('beforeend', modalHtml);
            
            document.getElementById('modal-cancel').onclick = () => document.getElementById('custom-modal').remove();
            document.getElementById('modal-confirm').onclick = () => {
                onConfirm();
                document.getElementById('custom-modal').remove();
            };
        };

        // UI Navigation
        window.switchView = (viewId) => {
            // Limpiar estado de edición si volvemos a inicio
            if (viewId === 'view-home') {
                editingRoutineId = null;
            }

            // Ocultar todas
            Object.values(views).forEach(v => v.classList.remove('active'));
            // Mostrar target
            if (views[viewId.replace('view-', '')]) {
                views[viewId.replace('view-', '')].classList.add('active');
            } else if (views[viewId]) {
                 views[viewId].classList.add('active');
            } else if (document.getElementById(viewId)){
                document.getElementById(viewId).classList.add('active');
            }

            // Gestionar UI Nav elements
            if (viewId === 'view-active-workout') {
                bottomNav.classList.add('hidden');
                mainHeader.classList.add('hidden');
                workoutHeader.classList.remove('hidden');
            } else {
                bottomNav.classList.remove('hidden');
                mainHeader.classList.remove('hidden');
                workoutHeader.classList.add('hidden');
            }

            // Reset formulario si se abre 'add' (y no estamos editando)
            if (viewId === 'view-add' && !editingRoutineId) {
                addViewTitle.textContent = "Nueva Rutina";
                exercisesContainer.innerHTML = '';
                newRoutineNameInput.value = '';
                addExerciseBlock(); // Iniciar con 1 bloque
            }

            // Actualizar Nav Bottom visual
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-blue-500');
                btn.classList.add('text-slate-500');
            });
            if (viewId === 'view-home') {
                document.querySelectorAll('.nav-btn')[0].classList.add('text-blue-500');
                document.querySelectorAll('.nav-btn')[0].classList.remove('text-slate-500');
            }
        };

        // --- Creador/Editor de Rutinas ---
        let exerciseCount = 0;
        
        window.addExerciseBlock = (exData = null) => {
            exerciseCount++;
            const id = `exercise-${Date.now()}-${exerciseCount}`;
            
            const nameVal = exData ? exData.name : '';
            const setsVal = exData ? exData.sets : '';
            const repsVal = exData ? exData.reps : '';
            const weightVal = exData ? exData.weight : '';
            const restVal = exData ? exData.rest : '';
            
            const block = document.createElement('div');
            block.className = "bg-slate-800 p-4 rounded-2xl border border-slate-700 relative group";
            block.id = id;
            
            block.innerHTML = `
                <button onclick="document.getElementById('${id}').remove()" class="absolute -top-3 -right-3 bg-slate-700 hover:bg-red-500 text-white p-1.5 rounded-full transition shadow-lg z-10">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
                <div class="space-y-3">
                    <div>
                        <input type="text" class="ex-name w-full bg-slate-900/50 text-white rounded-lg p-3 text-sm border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition placeholder-slate-500" placeholder="Nombre (ej. Sentadilla Libre)" value="${nameVal}">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] uppercase text-slate-500 font-bold ml-1">Series</label>
                            <input type="number" class="ex-sets w-full bg-slate-900/50 text-white rounded-lg p-3 text-sm border border-slate-700 focus:border-blue-500 outline-none" placeholder="Ej. 4" min="1" value="${setsVal}">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase text-slate-500 font-bold ml-1">Reps</label>
                            <input type="text" class="ex-reps w-full bg-slate-900/50 text-white rounded-lg p-3 text-sm border border-slate-700 focus:border-blue-500 outline-none" placeholder="Ej. 10-12" value="${repsVal}">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] uppercase text-slate-500 font-bold ml-1">Peso</label>
                            <input type="text" class="ex-weight w-full bg-slate-900/50 text-white rounded-lg p-3 text-sm border border-slate-700 focus:border-blue-500 outline-none" placeholder="Ej. 60 kg" value="${weightVal}">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase text-slate-500 font-bold ml-1">Descanso</label>
                            <input type="text" class="ex-rest w-full bg-slate-900/50 text-white rounded-lg p-3 text-sm border border-slate-700 focus:border-blue-500 outline-none" placeholder="Ej. 90s" value="${restVal}">
                        </div>
                    </div>
                </div>
            `;
            
            exercisesContainer.appendChild(block);
            
            if (!exData) {
                setTimeout(() => {
                    views.add.scrollTo({ top: views.add.scrollHeight, behavior: 'smooth' });
                }, 50);
            }
        };

        const saveToLocalStorage = () => {
            localStorage.setItem('fittrack_routines', JSON.stringify(routinesData));
        };

        // --- Guardar o Editar Rutina ---
        window.saveRoutine = () => {
            const name = newRoutineNameInput.value.trim();
            if (!name) {
                showToast("Por favor, ponle un nombre a tu rutina", "warning");
                return;
            }

            const exerciseNodes = exercisesContainer.children;
            if (exerciseNodes.length === 0) {
                showToast("Debes agregar al menos un ejercicio", "warning");
                return;
            }

            const exercises = [];
            for (let node of exerciseNodes) {
                const exName = node.querySelector('.ex-name').value.trim();
                if (!exName) continue;
                
                exercises.push({
                    name: exName,
                    sets: node.querySelector('.ex-sets').value.trim() || '1',
                    reps: node.querySelector('.ex-reps').value.trim() || '10',
                    weight: node.querySelector('.ex-weight').value.trim() || '-',
                    rest: node.querySelector('.ex-rest').value.trim() || '-'
                });
            }

            if (exercises.length === 0) {
                showToast("Nombra al menos un ejercicio", "warning");
                return;
            }

            if (editingRoutineId) {
                // Actualizar Rutina Existente
                const index = routinesData.findIndex(r => r.id === editingRoutineId);
                if(index !== -1) {
                    routinesData[index].name = name;
                    routinesData[index].exercises = exercises;
                }
                showToast("¡Rutina actualizada correctamente!");
            } else {
                // Crear Nueva Rutina
                const newRoutine = {
                    id: Date.now().toString(),
                    name: name,
                    exercises: exercises,
                    createdAt: Date.now()
                };
                routinesData.push(newRoutine);
                showToast("¡Rutina creada con éxito!");
            }

            saveToLocalStorage();
            renderRoutines(routinesData);
            switchView('view-home');
        };

        // --- Editar desde Home ---
        window.editRoutine = (event, id) => {
            event.stopPropagation(); // Evitar que se abra la vista de detalles
            const routine = routinesData.find(r => r.id === id);
            if (!routine) return;
            
            editingRoutineId = id;
            addViewTitle.textContent = "Editar Rutina";
            newRoutineNameInput.value = routine.name;
            exercisesContainer.innerHTML = '';
            
            routine.exercises.forEach(ex => addExerciseBlock(ex));
            
            switchView('view-add');
        };

        // --- Eliminar desde Home ---
        window.deleteRoutineFromHome = (event, id) => {
            event.stopPropagation();
            confirmAction("¿Eliminar Rutina?", "Esta acción no se puede deshacer. Se borrará permanentemente.", () => {
                routinesData = routinesData.filter(r => r.id !== id);
                saveToLocalStorage();
                renderRoutines(routinesData);
                showToast("Rutina eliminada");
            });
        };

        // --- Renderizar Home ---
        const renderRoutines = (routines) => {
            if (routines.length === 0) {
                routinesListContainer.classList.add('hidden');
                emptyStateContainer.classList.remove('hidden');
                return;
            }

            routinesListContainer.classList.remove('hidden');
            emptyStateContainer.classList.add('hidden');
            
            routinesListContainer.innerHTML = '';
            
            const sorted = [...routines].sort((a, b) => b.createdAt - a.createdAt);

            sorted.forEach(routine => {
                const numExercises = routine.exercises ? routine.exercises.length : 0;
                
                const card = document.createElement('div');
                card.className = "bg-slate-800 rounded-2xl p-5 border border-slate-700/50 shadow-sm cursor-pointer hover:border-blue-500/50 hover:bg-slate-800/80 transition group relative overflow-hidden";
                card.onclick = () => openRoutineDetail(routine.id);
                
                card.innerHTML = `
                    <div class="absolute top-0 right-0 w-24 h-24 bg-blue-500/10 rounded-bl-[100px] -z-0"></div>
                    <div class="relative z-10 flex justify-between items-start">
                        <div>
                            <h3 class="text-lg font-bold text-white mb-1 group-hover:text-blue-400 transition">${routine.name}</h3>
                            <p class="text-sm text-slate-400 font-medium flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" /></svg>
                                ${numExercises} ejercicios
                            </p>
                        </div>
                        <div class="flex gap-2 relative z-20">
                            <button onclick="editRoutine(event, '${routine.id}')" class="p-2 bg-slate-700/80 hover:bg-blue-500 rounded-lg text-slate-300 hover:text-white transition" title="Editar">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                            </button>
                            <button onclick="deleteRoutineFromHome(event, '${routine.id}')" class="p-2 bg-slate-700/80 hover:bg-red-500 rounded-lg text-slate-300 hover:text-white transition" title="Eliminar">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                    <div class="absolute bottom-4 right-4 bg-slate-700/50 p-2 rounded-full text-slate-300 group-hover:bg-blue-600 group-hover:text-white transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                    </div>
                `;
                routinesListContainer.appendChild(card);
            });
        };

        // --- Vista de Detalle de Rutina ---
        window.openRoutineDetail = (id) => {
            const routine = routinesData.find(r => r.id === id);
            if (!routine) return;
            
            selectedRoutineId = id;
            document.getElementById('detail-routine-name').textContent = routine.name;
            
            const listContainer = document.getElementById('detail-exercises-list');
            listContainer.innerHTML = '';
            
            routine.exercises.forEach((ex, idx) => {
                const div = document.createElement('div');
                div.className = "bg-slate-800 rounded-xl p-4 border border-slate-700/50 flex flex-col gap-2";
                div.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-700/50 pb-2">
                        <span class="font-bold text-slate-200 text-sm flex items-center gap-2">
                            <span class="bg-slate-700 text-xs px-2 py-0.5 rounded text-slate-300">${idx + 1}</span>
                            ${ex.name}
                        </span>
                    </div>
                    <div class="grid grid-cols-4 gap-2 text-center pt-1">
                        <div class="flex flex-col">
                            <span class="text-[9px] uppercase text-slate-500 font-bold tracking-wider">Series</span>
                            <span class="text-sm font-semibold text-white">${ex.sets}</span>
                        </div>
                        <div class="flex flex-col border-l border-slate-700">
                            <span class="text-[9px] uppercase text-slate-500 font-bold tracking-wider">Reps</span>
                            <span class="text-sm font-semibold text-white">${ex.reps}</span>
                        </div>
                        <div class="flex flex-col border-l border-slate-700">
                            <span class="text-[9px] uppercase text-slate-500 font-bold tracking-wider">Peso</span>
                            <span class="text-sm font-semibold text-white">${ex.weight}</span>
                        </div>
                        <div class="flex flex-col border-l border-slate-700">
                            <span class="text-[9px] uppercase text-slate-500 font-bold tracking-wider">Descanso</span>
                            <span class="text-sm font-semibold text-blue-400">${ex.rest}</span>
                        </div>
                    </div>
                `;
                listContainer.appendChild(div);
            });

            const startBtn = document.getElementById('start-workout-btn');
            startBtn.onclick = () => initActiveWorkout(routine);

            switchView('view-detail');
        };

        window.deleteCurrentRoutine = () => {
            if (!selectedRoutineId) return;
            confirmAction("¿Eliminar Rutina?", "Esta acción no se puede deshacer.", () => {
                routinesData = routinesData.filter(r => r.id !== selectedRoutineId);
                saveToLocalStorage();
                renderRoutines(routinesData);
                showToast("Rutina eliminada");
                switchView('view-home');
            });
        };

        // --- Modo Entrenamiento Activo ---
        window.initActiveWorkout = (routine) => {
            activeWorkoutSession = routine.exercises.map(ex => ({ ...ex, completed: false }));
            document.getElementById('workout-title').textContent = routine.name;
            updateWorkoutProgress();
            renderActiveWorkout();
            switchView('view-active-workout');
        };

        const renderActiveWorkout = () => {
            const container = document.getElementById('active-exercises-container');
            container.innerHTML = '';

            activeWorkoutSession.forEach((ex, index) => {
                const card = document.createElement('div');
                const isCompleted = ex.completed;
                const bgClass = isCompleted ? 'bg-slate-800/40 border-slate-700/30' : 'bg-slate-800 border-slate-700 shadow-lg';
                const textClass = isCompleted ? 'text-slate-500 line-through' : 'text-white';
                
                card.className = `${bgClass} rounded-2xl p-5 border transition-all duration-300`;
                card.innerHTML = `
                    <div class="flex items-start gap-4">
                        <div class="pt-1">
                            <input type="checkbox" class="custom-checkbox" 
                                ${isCompleted ? 'checked' : ''} 
                                onchange="toggleExercise(${index}, this.checked)">
                        </div>
                        <div class="flex-1">
                            <h3 class="text-lg font-bold ${textClass} line-through-transition mb-3">${ex.name}</h3>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-slate-900/50 rounded-lg p-2 flex items-center justify-between">
                                    <span class="text-[10px] uppercase text-slate-500 font-bold">Series</span>
                                    <span class="font-semibold text-sm ${isCompleted ? 'text-slate-500' : 'text-slate-200'}">${ex.sets}</span>
                                </div>
                                <div class="bg-slate-900/50 rounded-lg p-2 flex items-center justify-between">
                                    <span class="text-[10px] uppercase text-slate-500 font-bold">Reps</span>
                                    <span class="font-semibold text-sm ${isCompleted ? 'text-slate-500' : 'text-slate-200'}">${ex.reps}</span>
                                </div>
                                <div class="bg-slate-900/50 rounded-lg p-2 flex items-center justify-between">
                                    <span class="text-[10px] uppercase text-slate-500 font-bold">Peso</span>
                                    <span class="font-semibold text-sm ${isCompleted ? 'text-slate-500' : 'text-slate-200'}">${ex.weight}</span>
                                </div>
                                <div class="bg-slate-900/50 rounded-lg p-2 flex items-center justify-between">
                                    <span class="text-[10px] uppercase text-slate-500 font-bold">Descanso</span>
                                    <span class="font-semibold text-sm ${isCompleted ? 'text-slate-500' : 'text-emerald-400'}">${ex.rest}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        };

        window.toggleExercise = (index, isChecked) => {
            if(activeWorkoutSession[index]) {
                activeWorkoutSession[index].completed = isChecked;
                updateWorkoutProgress();
                renderActiveWorkout();
            }
        };

        const updateWorkoutProgress = () => {
            const total = activeWorkoutSession.length;
            const completed = activeWorkoutSession.filter(ex => ex.completed).length;
            const percentage = total > 0 ? (completed / total) * 100 : 0;
            document.getElementById('workout-progress').style.width = `${percentage}%`;
        };

        window.finishWorkout = (fromButton = false) => {
            const total = activeWorkoutSession.length;
            const completed = activeWorkoutSession.filter(ex => ex.completed).length;
            
            if (fromButton && completed < total) {
                confirmAction(
                    "Entrenamiento Incompleto", 
                    `Has completado ${completed} de ${total} ejercicios. ¿Seguro que quieres terminar?`, 
                    () => endWorkoutLogic(),
                    "bg-emerald-600 hover:bg-emerald-500"
                );
            } else {
                endWorkoutLogic();
                if (fromButton && completed === total) {
                    showToast("¡Felicidades! Entrenamiento Completado 🏆");
                }
            }
        };

        window.endWorkoutLogic = () => {
            activeWorkoutSession = [];
            switchView('view-home');
        };

        // --- INICIALIZACIÓN APP LOCALSTORAGE ---
        const initApp = () => {
            const storedRoutines = localStorage.getItem('fittrack_routines');
            if (storedRoutines) {
                try {
                    routinesData = JSON.parse(storedRoutines);
                } catch (e) {
                    console.error("Error cargando rutinas", e);
                    routinesData = [];
                }
            }
            renderRoutines(routinesData);
        };

        // Iniciar
        document.addEventListener('DOMContentLoaded', () => {
            initApp();
            switchView('view-home');
        });

    </script>
</body>
</html>
