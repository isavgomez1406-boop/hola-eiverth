<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahorcado Médico - Eiverth</title>
    <!-- Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdfa; /* bg-teal-50 */
        }
        /* Transiciones suaves entre pantallas */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Estilo para las letras ocultas */
        .letter-box {
            border-bottom: 3px solid #0f766e; /* teal-700 */
            min-width: 2rem;
            text-align: center;
            display: inline-block;
            margin: 0 4px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #115e59; /* teal-800 */
            text-transform: uppercase;
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center overflow-hidden text-slate-800">

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="w-full max-w-md h-full sm:h-auto sm:min-h-[600px] bg-white sm:rounded-2xl sm:shadow-2xl flex flex-col relative overflow-y-auto">
        
        <!-- VISTA 1: INICIO -->
        <section id="view-welcome" class="flex flex-col items-center justify-center flex-1 p-6 text-center fade-in">
            <div class="w-24 h-24 bg-teal-100 rounded-full flex items-center justify-center mb-6 shadow-inner">
                <span class="text-5xl">⚕️</span>
            </div>
            <h1 class="text-3xl font-extrabold text-teal-800 mb-2">Simulador Clínico</h1>
            <p class="text-lg text-teal-600 font-medium mb-8">Hola, Eiverth, aquí tengo un juego para ti.</p>
            
            <div class="bg-teal-50 p-4 rounded-xl text-sm text-slate-600 mb-8 border border-teal-100 text-left">
                <p class="mb-2"><strong>🩺 Misión:</strong> Descifra el diagnóstico o herramienta quirúrgica basándote en el cuadro clínico.</p>
                <p><strong>❤️ Vidas:</strong> Tienes 6 intentos antes de que el paciente se desestabilice.</p>
            </div>

            <button onclick="startGame()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-teal-600/30 transition-all transform hover:scale-[1.02] active:scale-95 text-lg">
                Comenzar
            </button>
        </section>

        <!-- VISTA 2: JUEGO -->
        <section id="view-game" class="hidden flex-col flex-1 p-6 fade-in">
            <!-- Header: Título y Vidas -->
            <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                <span class="text-sm font-bold text-teal-700 uppercase tracking-wider">Expediente</span>
                <div id="lives-container" class="text-xl tracking-widest bg-red-50 px-3 py-1 rounded-full border border-red-100">
                    <!-- Los corazones se renderizan por JS -->
                </div>
            </div>

            <!-- Pista Clínica -->
            <div class="bg-teal-800 text-white p-5 rounded-2xl shadow-md mb-8 relative">
                <div class="absolute -top-3 -left-3 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-lg transform -rotate-6 shadow-sm">
                    PISTA
                </div>
                <p id="hint-text" class="text-center text-sm md:text-base font-medium mt-2 leading-relaxed">
                    <!-- La pista se renderiza por JS -->
                </p>
            </div>

            <!-- Contenedor de la Palabra -->
            <div id="word-container" class="flex flex-wrap justify-center mb-auto min-h-[60px] gap-y-4">
                <!-- Las letras se renderizan por JS -->
            </div>

            <!-- Teclado en pantalla -->
            <div id="keyboard-container" class="flex flex-wrap justify-center gap-2 mt-8 pb-4">
                <!-- El teclado se renderiza por JS -->
            </div>
        </section>

        <!-- VISTA 3: RESULTADOS -->
        <section id="view-result" class="hidden flex-col items-center justify-center flex-1 p-6 text-center fade-in">
            <div id="result-icon" class="text-6xl mb-4">
                <!-- Icono de victoria o derrota -->
            </div>
            <h2 id="result-title" class="text-3xl font-extrabold mb-2">
                <!-- Título -->
            </h2>
            <p id="result-subtitle" class="text-slate-600 mb-6">
                <!-- Subtítulo -->
            </p>
            
            <div class="bg-slate-50 w-full p-4 rounded-xl border border-slate-200 mb-8">
                <p class="text-sm text-slate-500 uppercase tracking-widest mb-1">La respuesta correcta era:</p>
                <p id="correct-word" class="text-2xl font-black text-teal-800 tracking-wider">
                    <!-- Palabra correcta -->
                </p>
            </div>

            <button onclick="resetGame()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform hover:scale-[1.02] active:scale-95 text-lg">
                Jugar de nuevo
            </button>
        </section>

    </main>

    <script>
        // --- BASE DE DATOS MÉDICA ---
        const dictionary = [
            { word: "APENDICITIS", hint: "Inflamación del apéndice cecal, frecuentemente una urgencia quirúrgica." },
            { word: "LAPAROSCOPIA", hint: "Cirugía mínimamente invasiva utilizando una cámara introducida en la cavidad abdominal." },
            { word: "TORACOCENTESIS", hint: "Punción quirúrgica de la pared torácica para evacuar líquido o aire del espacio pleural." },
            { word: "TRAQUEOSTOMIA", hint: "Abertura quirúrgica en la tráquea para crear una vía respiratoria artificial." },
            { word: "ANEURISMA", hint: "Dilatación anormal y localizada de las paredes de una arteria." },
            { word: "ISQUEMIA", hint: "Reducción grave del flujo sanguíneo a los tejidos, causando sufrimiento celular." },
            { word: "SUTURA", hint: "Material utilizado por el cirujano para aproximar los bordes de una herida." },
            { word: "BISTURI", hint: "Instrumento en forma de cuchillo pequeño, de hoja muy afilada, usado en cirugía." },
            { word: "SEPSIS", hint: "Respuesta inflamatoria sistémica y extrema del cuerpo ante una infección grave." },
            { word: "ANESTESIA", hint: "Pérdida temporal de sensibilidad o conciencia inducida para realizar procedimientos quirúrgicos." }
        ];

        // --- ESTADO DEL JUEGO ---
        let currentWordObj = null;
        let guessedLetters = new Set();
        let lives = 6;
        const maxLives = 6;

        // --- REFERENCIAS AL DOM ---
        const viewWelcome = document.getElementById('view-welcome');
        const viewGame = document.getElementById('view-game');
        const viewResult = document.getElementById('view-result');
        
        const hintText = document.getElementById('hint-text');
        const wordContainer = document.getElementById('word-container');
        const keyboardContainer = document.getElementById('keyboard-container');
        const livesContainer = document.getElementById('lives-container');
        
        const resultIcon = document.getElementById('result-icon');
        const resultTitle = document.getElementById('result-title');
        const resultSubtitle = document.getElementById('result-subtitle');
        const correctWordText = document.getElementById('correct-word');

        // --- FUNCIONES DE NAVEGACIÓN ---
        function showView(viewToShow) {
            viewWelcome.classList.add('hidden');
            viewWelcome.classList.remove('flex');
            viewGame.classList.add('hidden');
            viewGame.classList.remove('flex');
            viewResult.classList.add('hidden');
            viewResult.classList.remove('flex');

            viewToShow.classList.remove('hidden');
            viewToShow.classList.add('flex');
        }

        // --- LÓGICA DEL JUEGO ---
        function startGame() {
            // Seleccionar palabra aleatoria
            const randomIndex = Math.floor(Math.random() * dictionary.length);
            currentWordObj = dictionary[randomIndex];
            
            // Reiniciar estado
            guessedLetters.clear();
            lives = maxLives;
            
            // Renderizar UI del juego
            hintText.textContent = currentWordObj.hint;
            renderHearts();
            renderWord();
            renderKeyboard();
            
            showView(viewGame);
        }

        function resetGame() {
            startGame();
        }

        function renderHearts() {
            const aliveHearts = '❤️'.repeat(lives);
            const deadHearts = '🤍'.repeat(maxLives - lives);
            livesContainer.innerHTML = aliveHearts + deadHearts;
        }

        function renderWord() {
            wordContainer.innerHTML = '';
            let isWon = true;

            for (const char of currentWordObj.word) {
                const span = document.createElement('span');
                span.className = 'letter-box';
                
                if (guessedLetters.has(char)) {
                    span.textContent = char;
                } else {
                    span.textContent = '';
                    isWon = false; // Faltan letras
                }
                wordContainer.appendChild(span);
            }

            if (isWon) {
                endGame(true);
            }
        }

        function renderKeyboard() {
            keyboardContainer.innerHTML = '';
            const alphabet = 'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('');

            alphabet.forEach(letter => {
                const btn = document.createElement('button');
                btn.textContent = letter;
                // Estilos del botón del teclado
                btn.className = `w-10 h-12 text-sm font-bold rounded-lg shadow-sm border border-slate-200 transition-colors 
                                 flex items-center justify-center bg-white text-slate-700 hover:bg-teal-50 active:bg-teal-100`;
                
                btn.onclick = () => handleGuess(letter, btn);
                keyboardContainer.appendChild(btn);
            });
        }

        function handleGuess(letter, btnElement) {
            // Deshabilitar el botón pulsado
            btnElement.disabled = true;
            
            if (currentWordObj.word.includes(letter)) {
                // Acierto
                guessedLetters.add(letter);
                btnElement.classList.remove('bg-white', 'hover:bg-teal-50', 'text-slate-700', 'border-slate-200');
                btnElement.classList.add('bg-teal-500', 'text-white', 'border-teal-600');
                renderWord();
            } else {
                // Fallo
                lives--;
                btnElement.classList.remove('bg-white', 'hover:bg-teal-50', 'text-slate-700', 'border-slate-200');
                btnElement.classList.add('bg-slate-200', 'text-slate-400', 'border-slate-300', 'opacity-50');
                renderHearts();
                
                if (lives === 0) {
                    endGame(false);
                }
            }
        }

        function endGame(isWin) {
            // Un pequeño retraso para que el usuario vea la última letra ingresada
            setTimeout(() => {
                showView(viewResult);
                
                correctWordText.textContent = currentWordObj.word;

                if (isWin) {
                    resultIcon.textContent = "🏆";
                    resultTitle.textContent = "¡Diagnóstico Exacto!";
                    resultTitle.className = "text-3xl font-extrabold mb-2 text-teal-600";
                    resultSubtitle.textContent = "Excelente trabajo estabilizando la situación.";
                } else {
                    resultIcon.textContent = "⚠️";
                    resultTitle.textContent = "Paciente Inestable";
                    resultTitle.className = "text-3xl font-extrabold mb-2 text-red-600";
                    resultSubtitle.textContent = "Se agotaron los intentos. Repasa este término médico.";
                }
            }, 500);
        }

    </script>
</body>
</html>
